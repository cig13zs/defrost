<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Restore text selection, copying, right-click, and scrolling on the active tab.">
<title>Defrost</title>
<style>
  :root{
    --bg:#faf9f6;      --panel:#fff;      --raised:#f3f1ec;
    --ink:#1c1a17;     --muted:#6b665d;   --line:#e4e0d8;
    --clay:#b4522f;    --clay-soft:#f7ece7;  --clay-ink:#fdfcfa;
    --ok:#1f7a4d;      --hit:#b3372c;     --hit-soft:#f9eae8;
    --r-sm:8px; --r-md:11px; --r-lg:14px; --r-pill:999px;
    --s1:6px; --s2:10px; --s3:14px; --s4:20px; --s5:28px;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#14130f;      --panel:#1c1a16;   --raised:#221f1a;
    --ink:#f0ede5;     --muted:#a09a8d;   --line:#2e2a24;
    --clay:#e0865e;    --clay-soft:#2a1c15;  --clay-ink:#14130f;
    --ok:#54c489;      --hit:#ef7f70;     --hit-soft:#2c1815;
  }}
  *{box-sizing:border-box}
  body{width:340px;max-width:100%;margin:0 auto;padding:var(--s3);
    background:var(--bg);color:var(--ink);
    font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}

  h1{font-size:17px;margin:0;font-weight:660;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
  h1 .tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:var(--r-pill);background:var(--clay-soft);color:var(--clay)}
  .sub{color:var(--muted);font-size:12.5px;margin:4px 0 var(--s3);line-height:1.4}

  .actions{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s2)}
  button.primary{width:100%;min-height:42px;padding:10px 16px;border-radius:var(--r-sm);font-weight:640;font-size:13.5px;
    border:1px solid var(--clay);background:var(--clay);color:var(--clay-ink);cursor:pointer;
    transition:background .15s ease,border-color .15s ease;display:flex;align-items:center;justify-content:center;gap:8px}
  button.primary:hover{background:var(--ink);border-color:var(--ink)}
  button.primary:disabled{opacity:.5;cursor:default}

  #result{margin-top:var(--s3);font-size:13px;display:none}
  .verdict{font-weight:680;color:var(--ok)}
  .chips{display:flex;gap:var(--s1);flex-wrap:wrap;margin-top:var(--s2)}
  .chip{font-size:11.5px;border:1px solid var(--line);border-radius:var(--r-pill);
    padding:3px 10px;color:var(--muted);background:var(--panel)}
  .chip b{color:var(--ink);font-weight:640}

  .links{display:flex;gap:var(--s2);margin-top:var(--s4);border-top:1px solid var(--line);padding-top:var(--s3)}
  .links a{flex:1;text-align:center;text-decoration:none;font-weight:620;font-size:12px;
    padding:8px;border-radius:var(--r-sm);min-height:36px;display:flex;align-items:center;justify-content:center}
  .kofi{background:var(--clay-soft);color:var(--clay);border:1px solid var(--clay)}
  .kofi:hover{background:var(--clay);color:var(--clay-ink)}
  .gh{background:var(--raised);color:var(--ink);border:1px solid var(--line)}
  .gh:hover{border-color:var(--muted)}
</style>
</head>
<body>
  <h1>Defrost <span class="tag">Offline</span></h1>
  <p class="sub">Restore selection, copying, right-click, and scrolling on this tab.</p>
  
  <div class="actions">
    <button id="defrost-btn" class="primary" type="button">Restore browser controls</button>
  </div>

  <div id="result" role="status" aria-live="polite">
    <div class="verdict">Browser controls restored</div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="links">
    <a class="kofi" href="https://ko-fi.com/jju1s" target="_blank" rel="noopener">Ko-fi</a>
    <a class="gh" href="https://github.com/cig13zs/defrost" target="_blank" rel="noopener">GitHub</a>
  </div>

<script src="popup.js"></script>
</body>
</html>
